- name: Start Firebase Emulator
  run: |
    npm install -g firebase-tools
    firebase emulators:start --only firestore &
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  compile:
    name: Compile and validate C++
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build demo with g++
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic -Iinclude src/aero_key.cpp examples/main.cpp -o aerokey_demo

      - name: Run demo
        run: ./aerokey_demo

      - name: Build core tests with g++
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic -Iinclude src/aero_key.cpp tests/test_core.cpp -o aerokey_tests

      - name: Run core tests
        run: ./aerokey_tests

  pip-install:
    name: Validate pip install + pybind11 module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: pip install project
        run: python -m pip install .

      - name: Import module smoke test
        run: |
          python - <<'PY'
          import aerokey
          assert hasattr(aerokey, "AeroPush")
          assert hasattr(aerokey, "AeroStatus")
          print("aerokey import OK")
          PY
